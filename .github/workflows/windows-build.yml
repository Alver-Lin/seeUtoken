name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: ['seeUtoken-win']
    tags: ['v1.0.2']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and test Windows executable
        shell: pwsh
        run: ./packaging/windows/build.ps1
      - name: Smoke test frozen application dependencies
        shell: pwsh
        run: |
          & ./packaging/windows/ensure_webview2.ps1
          if ($LASTEXITCODE -ne 0) { throw 'WebView2 runtime setup failed.' }
          & .venv-windows/Scripts/python.exe packaging/windows/smoke_test.py
          if ($LASTEXITCODE -ne 0) { throw 'Frozen application smoke test failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: seeUtoken-V1.0.2-windows-x64
          path: |
            dist/seeUtoken-V1.0.2.exe
            dist/seeUtoken-V1.0.2.exe.sha256
          if-no-files-found: error
          retention-days: 30
